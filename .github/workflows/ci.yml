name: CI

# Builds everything, runs the unit tests on every supported runtime and packs the NuGet packages as a build
# artifact. Nothing is published to NuGet from here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Source Link and the package metadata record the commit.
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build Inngest.slnx -c Release
      - run: dotnet test --project tests/Inngest.Tests/Inngest.Tests.csproj -c Release --no-build
      - name: Unit tests on .NET 8
        run: dotnet test --project tests/Inngest.Tests/Inngest.Tests.csproj -c Release -p:TestAllFrameworks=true --framework net8.0
      - name: Pack
        run: |
          for project in src/Inngest src/Inngest.AspNetCore src/Inngest.Connect src/Inngest.OpenTelemetry src/Inngest.Testing; do
            dotnet pack "$project" -c Release --no-build -o packages
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/

  integration:
    runs-on: ubuntu-latest
    # The suite starts Inngest servers with Testcontainers and reaches the test app through host-gateway. That path
    # is verified on Docker Desktop for Mac; until it is proven on Linux runners, a failure here does not fail CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/Inngest.IntegrationTests/Inngest.IntegrationTests.csproj -c Release
