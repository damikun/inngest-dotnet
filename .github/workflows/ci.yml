name: CI

# Builds everything, runs the unit tests on every supported runtime, packs the NuGet packages as a build artifact,
# builds what the project templates make and checks the Native AOT sample. Nothing is published to NuGet from here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Every job has a time limit well above how long it takes, so a hang fails instead of running for six hours.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Source Link and the package metadata record the commit.
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build Inngest.slnx -c Release
      - run: dotnet test --project tests/Inngest.Tests/Inngest.Tests.csproj -c Release --no-build
      - run: dotnet test --project tests/Inngest.Extensions.AI.Tests/Inngest.Extensions.AI.Tests.csproj -c Release --no-build
      # The source generator, the analyzers and the code fix of the Inngest package, on the compiler of this SDK. The tests
      # that pack the package and build an app from it take minutes, and run in the job below.
      - run: dotnet test --project tests/Inngest.SourceGeneration.Tests/Inngest.SourceGeneration.Tests.csproj -c Release --no-build --filter-not-namespace "Inngest.SourceGeneration.Tests.Packaging"
      - name: Unit tests on .NET 8
        run: dotnet test --project tests/Inngest.Tests/Inngest.Tests.csproj -c Release -p:TestAllFrameworks=true --framework net8.0
      - name: Chat client unit tests on .NET 8
        run: dotnet test --project tests/Inngest.Extensions.AI.Tests/Inngest.Extensions.AI.Tests.csproj -c Release -p:TestAllFrameworks=true --framework net8.0
      # Only the projects in src/ are packable, so a package added to the solution is packed without a change here.
      - name: Pack
        run: dotnet pack Inngest.slnx -c Release --no-build -o packages
      # A target in src/Inngest/Inngest.csproj adds them to the package, so a change there must not lose them quietly.
      - name: The Inngest package carries the generator and the analyzers
        run: |
          listing=$(unzip -l packages/Inngest.[0-9]*.nupkg)
          for file in analyzers/dotnet/cs/Inngest.SourceGeneration.dll analyzers/dotnet/cs/Inngest.SourceGeneration.CodeFixes.dll buildTransitive/Inngest.props buildTransitive/Inngest.targets; do
            grep -q "$file" <<< "$listing" || { echo "::error::$file is missing from the Inngest package."; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/

  # Packs Inngest and Inngest.AspNetCore into a local feed and builds an app from them, to check that the generator and the
  # analyzers reach it through the package: when it asks for them, and not before. The app is built with the SDK the job
  # runs under and with the .NET 8 SDK, which the job installs, pinned by a global.json in the app's folder.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test --project tests/Inngest.SourceGeneration.Tests/Inngest.SourceGeneration.Tests.csproj -c Release --filter-namespace "Inngest.SourceGeneration.Tests.Packaging"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The suite starts Inngest servers with Testcontainers and reaches the test app through host-gateway. That path
    # is verified on Docker Desktop for Mac; until it is proven on Linux runners, a failure here does not fail CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/Inngest.IntegrationTests/Inngest.IntegrationTests.csproj -c Release

  # Packs the packages of this repository into a folder, installs the template package from it and builds what the
  # templates make against it, so nuget.org is needed for the rest of what those projects use. That packs four projects
  # and builds two, which is why it is a job of its own.
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages target both runtimes, and one of the projects the tests build targets net8.0.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test --project tests/Inngest.Templates.Tests/Inngest.Templates.Tests.csproj -c Release

  # The analyzers behind IsAotCompatible cannot see what only happens in a native binary, such as reading the function
  # attributes at startup, so the sample is published and started. Warnings are errors, so a trimming or AOT warning
  # fails the publish.
  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish samples/Inngest.AotSample/Inngest.AotSample.csproj -c Release -r linux-x64 -o aot
      - name: Start the binary and count its functions
        # The sample reads appsettings.json from the folder it runs in. Dev mode needs no keys, and the app contacts no
        # dev server until one syncs it.
        working-directory: aot
        env:
          INNGEST_DEV: '1'
          ASPNETCORE_URLS: http://127.0.0.1:5080
        run: |
          ./Inngest.AotSample &
          for _ in $(seq 30); do
            body=$(curl -sf http://127.0.0.1:5080/api/inngest) && break
            sleep 1
          done
          echo "$body"
          # The sample registers greet, welcome-member and score-member.
          jq -e '.function_count == 3' <<< "$body"
