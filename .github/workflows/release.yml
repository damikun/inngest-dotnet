name: Release

# Publishes the NuGet packages when a version tag is pushed: the tag v0.1.0-preview.1 publishes version
# 0.1.0-preview.1. nuget.org trusted publishing trades the job's GitHub identity token for an API key that lasts an
# hour, so the repository stores no NuGet key. It needs a trusted publishing policy on nuget.org for this repository
# and this workflow file. Once a release is on nuget.org, raise PackageValidationBaselineVersion in
# src/Directory.Build.props to it, so the next one is checked against it.
#
# A release that nuget.org took only in part, for example because the policy did not cover a new package, is published
# again by running this workflow by hand with its tag: it builds the tag again and pushes what is not on nuget.org yet.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish again, such as v1.0.0
        required: true

permissions:
  contents: read

# Releases run one at a time, so a second tag waits for the first instead of racing it to nuget.org.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Every job has a time limit well above how long it takes, so a hang fails instead of holding up the next tag for six
# hours.
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A run by hand builds the tag it was given, not the head of the branch it was started from.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # Source Link and the package metadata record the commit, and the check below needs main's history.
          fetch-depth: 0
      - name: Read the version from the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag $TAG is not a version tag such as v1.2.3 or v1.2.3-preview.1."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG points at a commit that is not on main; only main is released."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build Inngest.slnx -c Release -p:Version="$VERSION"
      # Packed straight after the build: the .NET 8 tests below build again, and the packages must hold these assemblies.
      - name: Pack
        run: dotnet pack Inngest.slnx -c Release --no-build -p:Version="$VERSION" -o packages
      - run: dotnet test --project tests/Inngest.Tests/Inngest.Tests.csproj -c Release --no-build
      - run: dotnet test --project tests/Inngest.EntityFrameworkCore.Tests/Inngest.EntityFrameworkCore.Tests.csproj -c Release --no-build
      - name: Unit tests on .NET 8
        run: dotnet test --project tests/Inngest.Tests/Inngest.Tests.csproj -c Release -p:Version="$VERSION" -p:TestAllFrameworks=true --framework net8.0
      - name: Outbox unit tests on .NET 8
        run: dotnet test --project tests/Inngest.EntityFrameworkCore.Tests/Inngest.EntityFrameworkCore.Tests.csproj -c Release -p:Version="$VERSION" -p:TestAllFrameworks=true --framework net8.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may ask GitHub for an identity token, so nothing that runs during the build can publish.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # The nuget.org account that owns the trusted publishing policy.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: DaliborKundrat
      # Each package is pushed on its own, with the .snupkg next to it, so one that nuget.org refuses does not hold back
      # the others; the job then fails and names it. Versions already on nuget.org are skipped, so a release that failed
      # halfway can be published again.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          refused=()
          for package in packages/*.nupkg; do
            if ! dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate; then
              refused+=("$(basename "$package")")
            fi
          done
          if (( ${#refused[@]} > 0 )); then
            echo "::error::nuget.org refused ${refused[*]}"
            exit 1
          fi
